<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ari Maximiano | Carregando...</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <header class="profile-header">
            <div class="profile-info">
                <h1 id="name">...</h1>
                <h2 id="title">...</h2>
                <div class="contact-info">
                    <a id="email-link" href="#"><i class="fas fa-envelope"></i> <span id="email-text"></span></a>
                    <a id="linkedin-link" href="#" target="_blank"><i class="fab fa-linkedin"></i> LinkedIn</a>
                    <a id="github-link" href="#" target="_blank"><i class="fab fa-github"></i> GitHub</a>
                    <span><i class="fas fa-map-marker-alt"></i> <span id="location-text"></span></span>
                </div>
            </div>
        </header>

        <section class="section">
            <h3 class="section-title">Resumo Profissional</h3>
            <p id="summary-text">Carregando perfil...</p>
        </section>

        <section class="section">
            <h3 class="section-title">Tech Stack</h3>
            <div class="skills-grid">
                <div class="skill-category">
                    <h4>Back-end</h4>
                    <div class="tags" id="backend-list"></div>
                </div>
                <div class="skill-category">
                    <h4>Front-end</h4>
                    <div class="tags" id="frontend-list"></div>
                </div>
                <div class="skill-category">
                    <h4>Arquitetura & DevOps</h4>
                    <div class="tags" id="arch-list"></div>
                </div>
            </div>
        </section>

        <section class="section">
            <h3 class="section-title">Experiência Profissional</h3>
            <div id="experience-container">
                </div>
            
            <div class="job-item condensed">
                <div class="job-header">
                    <h4>Experiências Anteriores</h4>
                </div>
                <div id="previous-xp"></div>
            </div>
        </section>

        <section class="section">
            <h3 class="section-title">Formação</h3>
            <ul class="education-list" id="education-list"></ul>
        </section>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
